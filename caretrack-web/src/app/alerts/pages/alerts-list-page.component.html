<section class="alerts">
  <header class="alerts__header">
    <div>
      <h1>Gestion des alertes</h1>
      <p>Filtrez les alertes critiques, accusez réception et clôturez les actions.</p>
    </div>
    <div class="alerts__filters">
      <label>
        Statut
        <select (change)="setStatusFilter($event.target.value as any)">
          <option value="ALL">Tous</option>
          <option value="CRITICAL">Critique</option>
          <option value="PENDING">En attente</option>
          <option value="ACKNOWLEDGED">Reconnu</option>
          <option value="RESOLVED">Résolu</option>
        </select>
      </label>
      <label>
        Type
        <select (change)="setTypeFilter($event.target.value as any)">
          <option value="ALL">Tous</option>
          <option value="VITAL_SIGN">Constante</option>
          <option value="MEDICATION">Médication</option>
          <option value="PLAN_STEP">Plan de soins</option>
        </select>
      </label>
    </div>
  </header>

  <ct-card title="Alertes actives" subtitle="Tri par priorité">
    <ul class="alerts__list">
      <li *ngFor="let alert of filteredAlerts()" [class.alerts__item--critical]="alert.status === 'CRITICAL'">
        <div>
          <strong>{{ alert.patientName }}</strong>
          <p>{{ alert.message }}</p>
          <small>{{ alert.createdAt | date: 'short' }}</small>
        </div>
        <div class="alerts__meta">
          <ct-status-chip
            [status]="alert.status | statusLabel"
            [tone]="alert.status === 'CRITICAL' ? 'danger' : alert.status === 'RESOLVED' ? 'success' : 'warning'"
          ></ct-status-chip>
          <span>{{ alert.type | titlecase }}</span>
        </div>
        <div class="alerts__actions">
          <button type="button" (click)="acknowledgeAlert(alert.id)">Accuser réception</button>
          <button type="button" (click)="resolveAlert(alert.id)">Résoudre</button>
        </div>
      </li>
    </ul>
  </ct-card>
</section>
