<section class="login">
  <h1>Connexion</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Adresse e-mail
      <input type="email" formControlName="email" />
    </label>
    <label>
      Mot de passe
      <input type="password" formControlName="password" />
    </label>
    <button type="submit" [disabled]="form.invalid">Se connecter</button>
  </form>
</section>
