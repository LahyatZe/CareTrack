<section class="forgot">
  <ct-card title="Réinitialiser le mot de passe" subtitle="Recevez un lien de réinitialisation par e-mail">
    <form [formGroup]="form" (ngSubmit)="submit()" class="forgot__form" *ngIf="!submitted; else confirmation">
      <label>
        Adresse e-mail professionnelle
        <input type="email" formControlName="email" placeholder="prenom.nom@hopital.fr" required />
      </label>
      <button type="submit" [disabled]="form.invalid">Envoyer le lien</button>
      <a routerLink="../login" class="forgot__back">Retour à la connexion</a>
    </form>
  </ct-card>
</section>

<ng-template #confirmation>
  <div class="forgot__confirmation">
    <h2>Vérifiez votre messagerie</h2>
    <p>
      Si un compte correspond à cette adresse e-mail, un lien de réinitialisation vient d'être envoyé. Consultez votre
      boîte de réception et suivez les instructions.
    </p>
    <a routerLink="../login" class="forgot__back">Retour à la connexion</a>
  </div>
</ng-template>
