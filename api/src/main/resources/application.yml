spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/caretrack
    username: caretrack
    password: caretrack
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
